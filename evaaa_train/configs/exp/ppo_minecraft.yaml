# @package _global_
defaults:
  - override /algo: ppo
  - override /env: minecraft_bridge
  - override /model_manager: ppo
  - _self_

env:
  num_envs: 1
  frame_stack: 1
  screen_size: 64

checkpoint:
  every: 100000

algo:
  total_steps: 1000000
  per_rank_batch_size: 256
  anneal_lr: true
  gamma: 0.99
  gae_lambda: 0.95
  update_epochs: 3
  loss_reduction: mean
  normalize_advantages: true
  clip_coef: 0.1
  anneal_clip_coef: true
  clip_vloss: true
  ent_coef: 0.01
  anneal_ent_coef: false
  vf_coef: 0.5
  rollout_steps: 1024
  dense_units: 512
  mlp_layers: 1
  dense_act: torch.nn.ReLU
  layer_norm: false
  max_grad_norm: 0.5
  cnn_keys:
    encoder: [rgb]
  mlp_keys:
    encoder: [ev, olfactory, thermo, collision, touch]
  encoder:
    cnn_features_dim: 512
  optimizer:
    lr: 0.00025
    eps: 0.000001
    weight_decay: 0.0

buffer:
  share_data: false
  size: ${algo.rollout_steps}
