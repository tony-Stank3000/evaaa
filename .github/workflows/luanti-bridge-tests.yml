name: Luanti bridge tests

on:
  push:
    paths:
      - "luanti_port/**"
      - "evaaa_train/algos/ppo/ppo.py"
      - "evaaa_train/algos/dreamer_v3/dreamer_v3.py"
      - ".github/workflows/luanti-bridge-tests.yml"
  pull_request:
    paths:
      - "luanti_port/**"
      - "evaaa_train/algos/ppo/ppo.py"
      - "evaaa_train/algos/dreamer_v3/dreamer_v3.py"
      - ".github/workflows/luanti-bridge-tests.yml"
  workflow_dispatch:

concurrency:
  group: luanti-bridge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bridge-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository (sparse, avoid large research assets)
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            luanti_port
            evaaa_train/algos/ppo
            evaaa_train/algos/dreamer_v3
          sparse-checkout-cone-mode: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip gymnasium numpy
      - name: Compile bridge and modified trainer entry points
        run: python -m compileall -q luanti_port evaaa_train/algos/ppo/ppo.py evaaa_train/algos/dreamer_v3/dreamer_v3.py
      - name: Run Luanti bridge contract tests
        run: python -m unittest luanti_port.python.test_luanti_env -v
