name: Luanti bridge tests

on:
  push:
    paths:
      - "luanti_port/**"
      - ".github/workflows/luanti-bridge-tests.yml"
  pull_request:
    paths:
      - "luanti_port/**"
      - ".github/workflows/luanti-bridge-tests.yml"
  workflow_dispatch:

jobs:
  bridge-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip gymnasium numpy
      - name: Run Luanti bridge contract tests
        run: python -m unittest luanti_port.python.test_luanti_env -v
